# constat:template id=node-release-workflow version=75 sha256=3255aa273767b1c43f1095ad219db10d73a5d14060974d3b6ce86381d2654e56
name: constat-release
# Generated by DoneMark. Pressed by the constat-runner workflow after it has merged a released
# attempt into the default branch (Release with no hands, 2 September 2026). DoneMark presses
# nothing itself and never deploys: the step below is YOUR deploy, and DoneMark then witnesses the
# running app answering with the merged commit at the project's live address (GET /api/v1/version).
#
# A release does TWO things where a product publishes something as well as deploying it, and
# DoneMark records them separately (22 September 2026). The `release` input below is the id of the
# DoneMark release this deploy is of: the runner hands it over because this file asks for it. A
# deploy that wants to say what it deployed and what it published, in its own words, posts them to
# DoneMark at the end of the job, with GitHub's own identity token and no secret:
#
#   POST <constat>/api/v1/runner/releases/${{ inputs.release }}/outcomes
#   {"deployment":{"outcome":"done","words":"…"},"publish":{"outcome":"nothing_to_publish","words":"…"}}
#
# A deploy that says nothing is not a failure: the release shows what DoneMark witnessed, as always.
on:
  workflow_dispatch:
    inputs:
      release:
        description: The DoneMark release this deploy is of. Empty when you press Run yourself.
        required: false
        default: ''
permissions:
  contents: read
  # Only needed by a deploy that reports its own outcomes to DoneMark, as above.
  id-token: write
  # Only read by a host that deploys by itself and announces it to GitHub (Vercel).
  deployments: read
jobs:
  release:
    runs-on: ubuntu-latest
    # Only the default branch is ever released. A press on any other ref — by a runner, a person,
    # or a mistake — does nothing here, so an unjudged branch cannot reach your users through this door.
    if: github.ref_name == github.event.repository.default_branch
    steps:
      - uses: actions/checkout@v4
      - name: Going live is not set up yet
        run: echo "::notice::Going live is not set up yet, so nothing was deployed. Choose where this app goes live in DoneMark, or write your own deploy in this step."
