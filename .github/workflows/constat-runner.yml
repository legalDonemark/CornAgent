# constat:template id=node-runner-workflow version=76 sha256=e76a1778ee74849bb3f60bad660e378acdc9329a36f49d04a59e9332fb997bf1
name: constat-runner
# Generated by DoneMark. Picks up attempts you dispatch in DoneMark and runs them HERE — on this
# repository's own Actions runner, with this repository's own model key. DoneMark never holds the
# key and never starts anything itself; it queues the work, this workflow does it, and DoneMark then
# witnesses what CI did with its own read-only credential.
#
# Identity: the OIDC token GitHub mints for this job. Nothing to paste, nothing to rotate.
# The secrets, by NAME: CLAUDE_CODE_OAUTH_TOKEN — read by the agent your CI runs, never sent to DoneMark.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      lane:
        description: 'Which of this project’s lanes this runner stands in. DoneMark gives a project as many lanes as its owner asked for, and each lane queues on its own — so lane 2 runs beside lane 1 instead of behind it. Leave it at 1 unless you are opening a second lane by hand.'
        required: false
        default: '1'
  # GitHub honours the five-minute schedule loosely — hours apart on a quiet repository. So the
  # runner also wakes when CI or a release finishes on the default branch — but GitHub chains that
  # wake only when a person started that run, never from a run this runner pressed with its own
  # token. Names that do not exist here are simply never fired. So the first wake after you press
  # Dispatch or Release is yours: press Run here. DoneMark presses nothing.
  workflow_run:
    workflows: [ci, constat-ci, constat-release]
    types: [completed]
# Which lane this run is standing in, on GitHub's own Actions list. A person looking at three runs
# of one workflow can otherwise not tell which of them is the one holding their lane, and neither
# can the standing wake below, which asks GitHub this exact question before it stands down.
run-name: constat-runner lane ${{ inputs.lane || 1 }}
permissions:
  id-token: write
  contents: write
  pull-requests: write
  # To press your CI workflow's Run button on the agent's branch: a push made with this token
  # never starts CI by itself, and without this line pressing the button is refused (HTTP 403).
  actions: write
# ONE ATTEMPT AT A TIME PER LANE — not per repository (requirement of 12 September 2026).
#
# DoneMark gives a project as many attempts at once as it has lanes, and this workflow used to take
# them one at a time whatever the record said: a single group named for the whole repository. On
# 12 September 2026 a project with three lanes had three attempts accepted into lanes one, two and
# three, and GitHub ran one while three runners sat idle. The lane was real in the record and
# imaginary on the machine.
#
# So the group carries the lane. Three lanes, three groups, three attempts side by side; two
# attempts in ONE lane still stand one behind the other, which is the race this was always for —
# two agents on one machine, and, where they share a branch, each other's commits. A project can
# never exceed its lanes by pressing Run here: DoneMark refuses the attempt before any workflow is
# pressed, so this queue is what keeps one lane honest, never what decides how wide the project is.
#
# A wake with no lane — GitHub's schedule, and the workflow_run trigger above — stands in lane 1, which is
# every project that never asked for more, and is exactly what this workflow did before lanes.
concurrency:
  group: "constat-runner-lane-${{ inputs.lane || 1 }}"
  cancel-in-progress: false
jobs:
  run:
    # Where this project's attempts run (spec of 6 September 2026). GitHub's machines unless the
    # project named a runner of its own, and then that runner's label, so the loop keeps running
    # after a month of GitHub minutes has gone.
    runs-on: ubuntu-latest
    timeout-minutes: 1500
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Nothing is installed before asking: a wake with nothing queued, or a release (a git merge),
      # ends in seconds. The script installs these two only once an attempt is taken (the travel
      # test, 4 September 2026: seven minutes of installing an app to perform a merge).
      # Node itself, and no cache: this repository has no lock file for setup-node to key a cache
      # on, and asking for one would end this job here, before it has asked DoneMark for anything.
      - name: Ask DoneMark for a queued attempt, and run it if there is one
        env:
          CONSTAT_URL: "https://app.donemark.dev"
          # Which of the project's lanes this job stands in — the same number its concurrency group
          # is named for. The runner tells DoneMark, so the attempt it is handed is that lane's.
          CONSTAT_LANE: ${{ inputs.lane || 1 }}
          CONSTAT_INSTALL: "(cd frontend && npm install) && (cd server && python -m pip install uv && uv sync)"
          CONSTAT_PARTS: "This repository's app is in parts, one folder down. Run each part's tests from its own folder: frontend/ (Node.js, Vitest): cd frontend && npx vitest run; server/ (Python, pytest): cd server && uv run python -m pytest."
          CONSTAT_AGENT_CLI: "@anthropic-ai/claude-code@2.1.285"
          CONSTAT_CODEX_CLI: "@openai/codex@0.163.0"
          GH_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CODEX_API_KEY: ${{ secrets.CODEX_API_KEY }}
        run: node .github/scripts/constat-runner.mjs
