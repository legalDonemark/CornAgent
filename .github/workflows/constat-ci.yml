# constat:template id=parts-ci-workflow version=75 sha256=f7af4d779fc30d4b9e7f6cf27f7e508fab757b8b86fc8de1b9d68ee20776db01
name: constat-ci
# Generated by DoneMark. This repository's app is in parts, one folder down: Node.js in frontend/, Python in server/.
# Each part is tested in its own folder and writes its share of the check report; the report job
# merges the shares into constat-check-report, the one report DoneMark reads. On a pull
# request each part is also run on the code as it was before the change, and those shares are merged
# into constat-check-report-base, so a passing check can be told apart from one that cannot fail.
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: frontend
      - id: tests
        run: npx vitest run --reporter=json --outputFile=.constat/check-report/raw.json
        working-directory: frontend
      - if: always() && steps.tests.conclusion != 'skipped'
        run: node ../.github/scripts/constat-jest-report.mjs .constat/check-report/raw.json .constat/check-report/checks.json
        working-directory: frontend
      - if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-part-head-frontend
          path: frontend/.constat/check-report/checks.json
          if-no-files-found: error

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv && uv sync
        working-directory: server
      - id: tests
        run: uv run --with pytest python -m pytest --junitxml=.constat/check-report/report.xml
        working-directory: server
      - if: always() && steps.tests.conclusion != 'skipped'
        run: python3 ../.github/scripts/constat-pytest-report.py .constat/check-report/report.xml .constat/check-report/checks.json
        working-directory: server
      - if: always() && steps.tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-part-head-server
          path: server/.constat/check-report/checks.json
          if-no-files-found: error

  report:
    needs: [test-frontend, test-server]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: constat-part-head-*
          path: .constat/parts
      - run: node .github/scripts/constat-merge-parts.mjs .constat/check-report/checks.json frontend=.constat/parts/constat-part-head-frontend/checks.json server=.constat/parts/constat-part-head-server/checks.json
      - uses: actions/upload-artifact@v4
        with:
          name: constat-check-report
          path: .constat/check-report/checks.json
          if-no-files-found: error

  base-frontend:
    needs: test-frontend
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: head-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: constat-part-head-frontend
          path: frontend/.constat/head-report
      - if: steps.head-report.outcome != 'success'
        run: |
          echo "::warning::frontend/ published no report, so there is nothing to compare its checks against on the code before."
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - if: steps.head-report.outcome == 'success'
        run: bash .github/scripts/constat-rewind-to-base.sh "${{ github.base_ref }}"
      - if: steps.head-report.outcome == 'success'
        run: npm install
        working-directory: frontend
      - id: base-tests
        if: steps.head-report.outcome == 'success'
        continue-on-error: true
        run: npx vitest run --reporter=json --outputFile=.constat/check-report/raw.json
        working-directory: frontend
      - if: always() && steps.base-tests.conclusion != 'skipped'
        run: node ../.github/scripts/constat-jest-report.mjs .constat/check-report/raw.json .constat/check-report-base/checks.json --expected .constat/head-report/checks.json
        working-directory: frontend
      - if: always() && steps.base-tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-part-base-frontend
          path: frontend/.constat/check-report-base/checks.json
          if-no-files-found: error

  base-server:
    needs: test-server
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - id: head-report
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: constat-part-head-server
          path: server/.constat/head-report
      - if: steps.head-report.outcome != 'success'
        run: |
          echo "::warning::server/ published no report, so there is nothing to compare its checks against on the code before."
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: steps.head-report.outcome == 'success'
        run: bash .github/scripts/constat-rewind-to-base.sh "${{ github.base_ref }}"
      - if: steps.head-report.outcome == 'success'
        run: python -m pip install uv && uv sync
        working-directory: server
      - id: base-tests
        if: steps.head-report.outcome == 'success'
        continue-on-error: true
        run: uv run --with pytest python -m pytest --junitxml=.constat/check-report/report.xml
        working-directory: server
      - if: always() && steps.base-tests.conclusion != 'skipped'
        run: python3 ../.github/scripts/constat-pytest-report.py .constat/check-report/report.xml .constat/check-report-base/checks.json --expected .constat/head-report/checks.json
        working-directory: server
      - if: always() && steps.base-tests.conclusion != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: constat-part-base-server
          path: server/.constat/check-report-base/checks.json
          if-no-files-found: error

  base-report:
    needs: [base-frontend, base-server]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: constat-part-base-*
          path: .constat/parts
      - run: node .github/scripts/constat-merge-parts.mjs .constat/check-report-base/checks.json frontend=.constat/parts/constat-part-base-frontend/checks.json server=.constat/parts/constat-part-base-server/checks.json --allow-none
      - uses: actions/upload-artifact@v4
        with:
          name: constat-check-report-base
          path: .constat/check-report-base/checks.json
          if-no-files-found: ignore
